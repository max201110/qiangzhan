name: Bug report
about: 报告可复现的问题
labels: bug
body:
  - type: input
    id: project
    attributes:
      label: 项目
      placeholder: NeonArena / MechAssault / TacticalInfiltration
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
    validations:
      required: true
